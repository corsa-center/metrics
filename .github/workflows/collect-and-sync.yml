name: Collect Metrics

on:
  schedule:
    # Hourly, ~4 packages/run (see GROUP_COUNT below) rather than the whole
    # catalog or even a weekly half of it. Even at ~4x a single package's
    # GitHub request volume (~80-100 requests), this stays comfortably
    # under any rate limit regardless of which token is used or how many
    # collectors get added later -- this sidesteps needing to reason
    # precisely about the exact budget at all, unlike the two earlier
    # attempts this same day that got the math wrong (once assuming
    # 5,000/hour when the automatic token is actually 1,000/hour; once
    # because a ~36-package group still wasn't small enough even at
    # 5,000/hour once retries were added back in). It also means every
    # package refreshes roughly every 18 hours, fresher than both the
    # weekly cadence before any of today's fixes and the ~1.5-day cycle
    # the original 2/run split gave.
    #
    # Minute 7, not 0: GitHub explicitly documents that scheduled workflows
    # are best-effort and can be delayed or dropped under high load, and
    # recommends avoiding the top of the hour specifically because that's
    # when every other repo's hourly cron also fires. Confirmed live: after
    # switching to hourly at minute 0, only 1 of the 8 expected firings
    # between 2026-09-16T21:00Z and 2026-09-17T05:00Z actually ran. GROUP is
    # computed from `date -u +%s / 3600`, which only depends on which UTC
    # hour the job runs in, not which minute -- so this doesn't change the
    # round-robin group a given firing gets.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      software_filter:
        description: 'Filter to specific software (optional)'
        required: false
        type: string
      dry_run:
        description: 'Perform dry run (no artifact upload)'
        required: false
        type: boolean
        default: false
      group_count:
        description: 'Split the catalog into this many round-robin groups (optional; omit for a full run)'
        required: false
        type: string
      group:
        description: '0-indexed group to run (requires group_count; ignored if software_filter is set)'
        required: false
        type: string

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    # Outer safety net sized for the rare manual full-catalog dispatch (see
    # "Run orchestrator" below for the tighter per-step timeout that
    # actually applies to the common case -- an hourly ~2-package run).
    timeout-minutes: 240

    steps:
      - name: Checkout metrics repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run orchestrator
        # A scheduled run is ~4 packages (see GROUP_COUNT below); anything
        # taking anywhere near this long means something is actually stuck,
        # not just slow, so fail fast rather than block the next hourly run.
        # A manual full-catalog dispatch (group_count left blank) needs the
        # same headroom a full run always has -- github context is
        # well-documented as available at step level, unlike at the job
        # level above, which is why the dynamic part lives here.
        timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.group_count == '') && 240 || 30 }}
        env:
          # Small hourly batches (see GROUP_COUNT below) keep real request
          # volume around ~400/hour -- comfortably under even the automatic
          # token's 1,000/hour-per-repository cap (itself well below the
          # 5,000/hour a personal token gets), so routine operation doesn't
          # need an elevated credential, or the bus-factor risk of tying one
          # to a specific person's account, at all. A manual full-catalog
          # dispatch is the one case that still exceeds 1,000/hour; that's
          # an occasional manual/debugging path, not something the schedule
          # depends on, so it's an accepted limitation rather than a reason
          # to keep routine runs on an elevated token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: |
          SOFTWARE_ARG="${{ github.event.inputs.software_filter }}"
          DRY_RUN_ARG="${{ github.event.inputs.dry_run }}"

          CMD="python orchestrator.py --config config/orchestrator.yaml"

          if [ -n "$SOFTWARE_ARG" ]; then
            CMD="$CMD --software $SOFTWARE_ARG"
          fi

          if [ "$DRY_RUN_ARG" = "true" ]; then
            CMD="$CMD --dry-run"
            echo "::notice::Running in dry-run mode, no artifact will be uploaded"
          fi

          # Scheduled runs always split into GROUP_COUNT round-robin groups,
          # picked by hours-since-epoch -- safe as a plain modulo here
          # because every hourly firing is evenly spaced (unlike the earlier
          # weekly Sunday/Wednesday design this replaced, where the uneven
          # 3-vs-4-day gap made a parity trick unsafe).
          # A manual dispatch only splits if asked (group_count/group inputs);
          # left blank, it runs the whole catalog, same as before batching --
          # useful for validating a fix across everything at once.
          GROUP_COUNT=18  # ~4 packages/run for a ~71-package catalog; grows
                          # gracefully (batch size creeps up, not coverage
                          # breaking) if the catalog grows past ~72.
          if [ -n "$SOFTWARE_ARG" ]; then
            : # targeting one package by name -- grouping would be meaningless
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            GROUP=$(( $(date -u +%s) / 3600 % GROUP_COUNT ))
            CMD="$CMD --group-count $GROUP_COUNT --group $GROUP"
            echo "::notice::Scheduled run: group $GROUP/$GROUP_COUNT"
          elif [ -n "${{ github.event.inputs.group_count }}" ] && [ -n "${{ github.event.inputs.group }}" ]; then
            CMD="$CMD --group-count ${{ github.event.inputs.group_count }} --group ${{ github.event.inputs.group }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Upload metrics artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sustainability-metrics
          path: output/*-metrics/
          retention-days: 90

      - name: Upload reports artifact
        uses: actions/upload-artifact@v7
        with:
          name: metrics-reports
          path: |
            output/*.json
            *.log
          retention-days: 30

      - name: Create summary
        run: |
          echo "## Metrics Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f output/orchestrator_summary.json ]; then
            TOTAL=$(jq -r '.total_packages' output/orchestrator_summary.json)
            AVG_SCORE=$(jq -r '.avg_overall_score' output/orchestrator_summary.json)

            echo "- **Total Packages:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Average Score:** $(printf '%.1f' $AVG_SCORE)/100" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Score Distribution" >> $GITHUB_STEP_SUMMARY
            jq -r '.packages_by_score | to_entries[] | "- **\(.key):** \(.value)"' output/orchestrator_summary.json >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Top 5 Packages" >> $GITHUB_STEP_SUMMARY
            jq -r '.top_packages[:5][] | "- \(.[0]): \(.[1])/100"' output/orchestrator_summary.json >> $GITHUB_STEP_SUMMARY
          fi
