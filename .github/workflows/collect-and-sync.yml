name: Collect Metrics

on:
  schedule:
    # Low-frequency, self-healing fallback only -- NOT the primary hourly
    # driver. Hourly native cron measurably failed to deliver most of its
    # scheduled firings at both minute 0 (1 of 8 expected between
    # 2026-09-16T21:00Z and 2026-09-17T05:00Z) and minute 7 (missed its
    # first opportunity too), even with the default branch, repo/org
    # policy, concurrency limits and a live-incident check all ruled out.
    # A comparison against HDFGroup/hdf5's own weekly-scheduled Scorecard
    # workflow confirmed `schedule` does fire reliably on GitHub in
    # general (within ~3 min of target, both observed weeks) -- the
    # difference is frequency: GitHub explicitly documents `schedule` as
    # best-effort and more likely to be delayed or dropped the more often
    # it's requested, and hourly is squarely in that regime.
    #
    # The actual hourly cadence now comes from the "schedule-next" job
    # below: collect-metrics re-dispatches itself via workflow_dispatch
    # (which GitHub treats as an immediate interactive request, not a
    # low-priority scheduled queue, so it isn't subject to the same
    # dropping) roughly an hour after each run starts. This daily cron is
    # just the self-healing backstop for that chain -- if it ever breaks
    # (a crashed runner, a failed dispatch call), this restarts it within
    # at most a day, since firing here also triggers schedule-next.
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      software_filter:
        description: 'Filter to specific software (optional)'
        required: false
        type: string
      dry_run:
        description: 'Perform dry run (no artifact upload)'
        required: false
        type: boolean
        default: false
      group_count:
        description: 'Split the catalog into this many round-robin groups (optional; omit for a full run)'
        required: false
        type: string
      group:
        description: '0-indexed group to run (requires group_count; ignored if software_filter is set)'
        required: false
        type: string
      chain:
        description: 'Internal -- set by the self-triggering hourly chain, not meant for manual use. Auto-groups like a scheduled run and re-arms the next hourly firing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # schedule-next needs this to dispatch the next run

concurrency:
  # Automated (schedule- or chain-triggered) runs queue behind each other
  # so two cycles never overlap; a manual test dispatch always gets its
  # own run_id-keyed group, so it never waits behind schedule-next's ~1hr
  # sleep.
  group: collect-metrics-${{ (github.event_name == 'schedule' || github.event.inputs.chain == 'true') && 'chain' || github.run_id }}
  cancel-in-progress: false

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    # Outer safety net sized for the rare manual full-catalog dispatch (see
    # "Run orchestrator" below for the tighter per-step timeout that
    # actually applies to the common case -- an hourly ~2-package run).
    timeout-minutes: 240

    steps:
      - name: Checkout metrics repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run orchestrator
        # A scheduled or chain-continuation run is ~4 packages (see
        # GROUP_COUNT below); anything taking anywhere near this long means
        # something is actually stuck, not just slow, so fail fast rather
        # than block the next hourly run. A manual full-catalog dispatch
        # (group_count left blank, chain not set) needs the same headroom a
        # full run always has -- github context is well-documented as
        # available at step level, unlike at the job level above, which is
        # why the dynamic part lives here.
        timeout-minutes: >-
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.group_count == '' && github.event.inputs.chain != 'true') && 240 || 30 }}
        env:
          # Small hourly batches (see GROUP_COUNT below) keep real request
          # volume around ~700/hour -- still comfortably under the automatic
          # token's 1,000/hour-per-repository cap (itself well below the
          # 5,000/hour a personal token gets), with margin held back for
          # per-package variance and retry amplification, so routine
          # operation doesn't need an elevated credential, or the
          # bus-factor risk of tying one to a specific person's account, at
          # all. A manual full-catalog
          # dispatch is the one case that still exceeds 1,000/hour; that's
          # an occasional manual/debugging path, not something the schedule
          # depends on, so it's an accepted limitation rather than a reason
          # to keep routine runs on an elevated token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: |
          SOFTWARE_ARG="${{ github.event.inputs.software_filter }}"
          DRY_RUN_ARG="${{ github.event.inputs.dry_run }}"

          CMD="python orchestrator.py --config config/orchestrator.yaml"

          if [ -n "$SOFTWARE_ARG" ]; then
            CMD="$CMD --software $SOFTWARE_ARG"
          fi

          if [ "$DRY_RUN_ARG" = "true" ]; then
            CMD="$CMD --dry-run"
            echo "::notice::Running in dry-run mode, no artifact will be uploaded"
          fi

          # Scheduled and chain-continuation runs always split into
          # GROUP_COUNT round-robin groups, picked by hours-since-epoch --
          # safe as a plain modulo here because both fire roughly once an
          # hour (unlike the earlier weekly Sunday/Wednesday design this
          # replaced, where the uneven 3-vs-4-day gap made a parity trick
          # unsafe).
          # A manual dispatch only splits if asked (group_count/group inputs);
          # left blank, it runs the whole catalog, same as before batching --
          # useful for validating a fix across everything at once.
          GROUP_COUNT=10  # ~7 packages/run for a 71-package catalog (~700
                          # req/hour at ~80-100 req/package, ~30% margin
                          # under the 1,000/hour cap); grows gracefully
                          # (batch size creeps up, not coverage breaking)
                          # if the catalog grows past 80. Full-catalog
                          # refresh drops to ~10.3 hours at the chain's
                          # observed ~62min/cycle (was ~18.6 hours at
                          # 4/run, ~12.4 hours at 6/run).
          if [ -n "$SOFTWARE_ARG" ]; then
            : # targeting one package by name -- grouping would be meaningless
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.chain }}" = "true" ]; then
            GROUP=$(( $(date -u +%s) / 3600 % GROUP_COUNT ))
            CMD="$CMD --group-count $GROUP_COUNT --group $GROUP"
            echo "::notice::Auto-grouped run: group $GROUP/$GROUP_COUNT"
          elif [ -n "${{ github.event.inputs.group_count }}" ] && [ -n "${{ github.event.inputs.group }}" ]; then
            CMD="$CMD --group-count ${{ github.event.inputs.group_count }} --group ${{ github.event.inputs.group }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Upload metrics artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sustainability-metrics
          path: output/*-metrics/
          retention-days: 90

      - name: Upload reports artifact
        uses: actions/upload-artifact@v7
        with:
          name: metrics-reports
          path: |
            output/*.json
            *.log
          retention-days: 30

      - name: Create summary
        run: |
          echo "## Metrics Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f output/orchestrator_summary.json ]; then
            TOTAL=$(jq -r '.total_packages' output/orchestrator_summary.json)
            AVG_SCORE=$(jq -r '.avg_overall_score' output/orchestrator_summary.json)

            echo "- **Total Packages:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Average Score:** $(printf '%.1f' $AVG_SCORE)/100" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Score Distribution" >> $GITHUB_STEP_SUMMARY
            jq -r '.packages_by_score | to_entries[] | "- **\(.key):** \(.value)"' output/orchestrator_summary.json >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Top 5 Packages" >> $GITHUB_STEP_SUMMARY
            jq -r '.top_packages[:5][] | "- \(.[0]): \(.[1])/100"' output/orchestrator_summary.json >> $GITHUB_STEP_SUMMARY
          fi

  schedule-next:
    # Re-arms the hourly chain (see the top-level `schedule:` comment for
    # why this replaced native hourly cron). Only runs for automated
    # invocations -- a manual test dispatch (chain not set, event not
    # schedule) must not spawn an unbounded chain of its own.
    #
    # `if: always()` means this fires even if collect-metrics failed: a
    # single bad run (a code bug, a transient API outage) must not silently
    # kill the whole chain, since there'd be no alert and no way to notice
    # until someone happens to check. The residual risks this doesn't cover
    # (the runner itself crashing, this dispatch call failing) are what the
    # daily fallback cron above is for.
    needs: collect-metrics
    if: always() && (github.event_name == 'schedule' || github.event.inputs.chain == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait ~1 hour, then re-dispatch this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CYCLE_SECONDS=3600
          START=$(date -u +%s)
          ELAPSED=$(( $(date -u +%s) - START ))
          REMAINING=$(( CYCLE_SECONDS - ELAPSED ))
          if [ "$REMAINING" -gt 0 ]; then
            echo "::notice::Sleeping ${REMAINING}s before re-dispatching"
            sleep "$REMAINING"
          fi
          gh workflow run collect-and-sync.yml --repo "${{ github.repository }}" --ref main -f chain=true
