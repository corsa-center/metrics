name: Collect Metrics

on:
  schedule:
    # Two fixed entries rather than one weekly run split by date arithmetic:
    # a full run's GitHub request volume is already close to the hourly
    # quota before any retries, so the catalog is split into 2 groups (see
    # the "Run orchestrator" step) -- but every package should still
    # refresh weekly, not every other week, so each group gets its own
    # fixed day instead of alternating a single weekly slot.
    # github.event.schedule tells the "Run orchestrator" step which of
    # these fired, so which group runs is a lookup, not computed from the
    # date -- deliberately avoiding a parity trick (e.g. ISO week % 2),
    # which only alternates correctly for evenly-spaced firings. Sunday to
    # Wednesday is 3 days, Wednesday to the next Sunday is 4; a scheme
    # relying on the gap being consistently odd would occasionally run the
    # same group twice in a row.
    - cron: '0 0 * * 0'  # Sunday: group 0
    - cron: '0 0 * * 3'  # Wednesday: group 1
  workflow_dispatch:
    inputs:
      software_filter:
        description: 'Filter to specific software (optional)'
        required: false
        type: string
      dry_run:
        description: 'Perform dry run (no artifact upload)'
        required: false
        type: boolean
        default: false
      group_count:
        description: 'Split the catalog into this many round-robin groups (optional; omit for a full run)'
        required: false
        type: string
      group:
        description: '0-indexed group to run (requires group_count; ignored if software_filter is set)'
        required: false
        type: string

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    # A full 68-package run took 55min on 2026-08-31; the two full runs since
    # (2026-09-06 schedule, 2026-09-09 dispatch) each ran to exactly the old
    # 120min limit and were auto-cancelled, so no full run has succeeded in
    # over a week -- the downstream dashboard silently fell back to whatever
    # older/narrower run last had a "success" conclusion. 240 gives headroom
    # for that growth (more collectors keep being added) without masking a
    # true hang indefinitely.
    timeout-minutes: 240

    steps:
      - name: Checkout metrics repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: |
          SOFTWARE_ARG="${{ github.event.inputs.software_filter }}"
          DRY_RUN_ARG="${{ github.event.inputs.dry_run }}"

          CMD="python orchestrator.py --config config/orchestrator.yaml"

          if [ -n "$SOFTWARE_ARG" ]; then
            CMD="$CMD --software $SOFTWARE_ARG"
          fi

          if [ "$DRY_RUN_ARG" = "true" ]; then
            CMD="$CMD --dry-run"
            echo "::notice::Running in dry-run mode, no artifact will be uploaded"
          fi

          # Scheduled runs always split 2 ways -- which group is a direct
          # lookup from which cron entry fired (see the `on.schedule`
          # comment above for why this isn't computed from the date).
          # A manual dispatch only splits if asked (group_count/group inputs);
          # left blank, it runs the whole catalog, same as before batching --
          # useful for validating a fix across everything at once.
          if [ -n "$SOFTWARE_ARG" ]; then
            : # targeting one package by name -- grouping would be meaningless
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '0 0 * * 0') GROUP=0 ;;
              '0 0 * * 3') GROUP=1 ;;
              *) echo "::error::Unrecognized schedule '${{ github.event.schedule }}'"; exit 1 ;;
            esac
            CMD="$CMD --group-count 2 --group $GROUP"
            echo "::notice::Scheduled run (${{ github.event.schedule }}): group $GROUP/2"
          elif [ -n "${{ github.event.inputs.group_count }}" ] && [ -n "${{ github.event.inputs.group }}" ]; then
            CMD="$CMD --group-count ${{ github.event.inputs.group_count }} --group ${{ github.event.inputs.group }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Upload metrics artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sustainability-metrics
          path: output/*-metrics/
          retention-days: 90

      - name: Upload reports artifact
        uses: actions/upload-artifact@v7
        with:
          name: metrics-reports
          path: |
            output/*.json
            *.log
          retention-days: 30

      - name: Create summary
        run: |
          echo "## Metrics Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f output/orchestrator_summary.json ]; then
            TOTAL=$(jq -r '.total_packages' output/orchestrator_summary.json)
            AVG_SCORE=$(jq -r '.avg_overall_score' output/orchestrator_summary.json)

            echo "- **Total Packages:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Average Score:** $(printf '%.1f' $AVG_SCORE)/100" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Score Distribution" >> $GITHUB_STEP_SUMMARY
            jq -r '.packages_by_score | to_entries[] | "- **\(.key):** \(.value)"' output/orchestrator_summary.json >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Top 5 Packages" >> $GITHUB_STEP_SUMMARY
            jq -r '.top_packages[:5][] | "- \(.[0]): \(.[1])/100"' output/orchestrator_summary.json >> $GITHUB_STEP_SUMMARY
          fi
